input_path: data/inference/input/input.csv
pipeline_path: artifacts/models/v001/LogisticRegression.joblib

required_columns:
  - customerID
  - gender
  - SeniorCitizen
  - Partner
  - Dependents
  - tenure
  - PhoneService
  - MultipleLines
  - InternetService
  - OnlineSecurity
  - OnlineBackup
  - DeviceProtection
  - TechSupport
  - StreamingTV
  - StreamingMovies
  - Contract
  - PaperlessBilling
  - PaymentMethod
  - MonthlyCharges
  - TotalCharges

schema:
  customerID:
    dtype: category

  gender:
    dtype: category
    allowed_values:
      - Male
      - Female

  SeniorCitizen:
    dtype: bool
    true_values:
      - 1
      - "1"
      - true
    false_values:
      - 0
      - "0"
      - false

  Partner:
    dtype: bool
    true_values:
      - "Yes"
    false_values:
      - "No"

  Dependents:
    dtype: bool
    true_values:
      - "Yes"
    false_values:
      - "No"

  tenure:
    dtype: numeric
    nullable: false
    min: 0

  PhoneService:
    dtype: bool
    true_values:
      - "Yes"
    false_values:
      - "No"

  MultipleLines:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No phone service"

  InternetService:
    dtype: category
    allowed_values:
      - DSL
      - Fiber optic
      - "No"

  OnlineSecurity:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No internet service"

  OnlineBackup:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No internet service"

  DeviceProtection:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No internet service"

  TechSupport:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No internet service"

  StreamingTV:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No internet service"

  StreamingMovies:
    dtype: category
    allowed_values:
      - "Yes"
      - "No"
      - "No internet service"

  Contract:
    dtype: category
    allowed_values:
      - "Month-to-month"
      - "One year"
      - "Two year"

  PaperlessBilling:
    dtype: bool
    true_values:
      - "Yes"
    false_values:
      - "No"

  PaymentMethod:
    dtype: category
    allowed_values:
      - "Electronic check"
      - "Mailed check"
      - "Bank transfer (automatic)"
      - "Credit card (automatic)"

  MonthlyCharges:
    dtype: numeric
    nullable: false
    min: 0

  TotalCharges:
    dtype: numeric
    nullable: true
    min: 0